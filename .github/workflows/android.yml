name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Prepare Google Services for debug build
        run: |
          python3 - <<'PY'
          import json
          path = "app_pojavlauncher/google-services.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          for client in data.get("client", []):
              package = client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              if package == "com.cslaucher.plus.debug":
                  break
          else:
              if data.get("client"):
                  debug_client = json.loads(json.dumps(data["client"][0]))
                  debug_client.setdefault("client_info", {}).setdefault("android_client_info", {})["package_name"] = "com.cslaucher.plus.debug"
                  data["client"].append(debug_client)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build LE Launcher
        run: ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace
